<head>

<title>Private</title>

<meta name="theme-color" content="#0B101A">
<style>
:root{--bg:#0B101A;--raise:#151B27;--line:rgba(237,236,244,.08);--line-2:rgba(237,236,244,.16);--ink:#EDECF4;--ink-2:#B6BECC;--ink-3:#8E97A8;--sun:#E0DAF1;--on-sun:#11161F;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body.wait form{visibility:hidden}
form{width:100%;max-width:340px;background:var(--raise);border-radius:18px;padding:24px 20px;box-shadow:0 0 0 1px var(--line)}
h1{font-size:20px;font-weight:500;margin-bottom:4px}
p{color:var(--ink-3);font-size:14px;margin-bottom:18px}
input[type=password]{width:100%;height:46px;padding:0 14px;border-radius:12px;border:0;background:var(--bg);color:var(--ink);font:inherit;font-size:16px;box-shadow:inset 0 0 0 1px var(--line-2)}
input[type=password]:focus{outline:2px solid var(--sun);outline-offset:1px}
label{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px;color:var(--ink-2);cursor:pointer}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--sun)}
button{display:block;width:100%;height:46px;margin-top:18px;border:0;border-radius:23px;background:var(--sun);color:var(--on-sun);font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.msg{min-height:20px;margin-top:12px;font-size:13px;color:#e8c9a8}
</style>
</head>

<script>
(() => {
  'use strict';
  const KEY = 'drift.lab.key', L = JSON.parse(document.getElementById('lock').textContent);
  const bytes = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const show = () => { document.body.classList.remove('wait'); document.getElementById('p').focus(); };
  const open = async (key) => {   // swap this page for the unlocked one: its head, its body, then its scripts in order
    const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(L.iv) }, key, bytes(L.data)));
    const doc = new DOMParser().parseFromString(html, 'text/html');
    document.documentElement.lang = doc.documentElement.lang;
    document.head.replaceWith(document.importNode(doc.head, true));
    document.body.replaceWith(document.importNode(doc.body, true));
    for (const old of [...document.querySelectorAll('script')]) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      if (old.src) { await new Promise((ok, fail) => { s.onload = ok; s.onerror = fail; old.replaceWith(s); }); }
      else { s.textContent = old.textContent; old.replaceWith(s); }
    }
  };
  let saved = null; try { saved = localStorage.getItem(KEY); } catch {}
  if (saved) crypto.subtle.importKey('raw', bytes(saved), 'AES-GCM', false, ['decrypt']).then(open).catch(() => { try { localStorage.removeItem(KEY); } catch {} show(); });
  else show();
  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('b'), msg = document.getElementById('m');
    const pass = document.getElementById('p').value.trim().toLowerCase();   // phones like to capitalise the first letter
    btn.disabled = true; btn.textContent = 'Unlocking…'; msg.textContent = '';
    try {
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(L.salt), iterations: L.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
      await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(L.iv) }, key, bytes(L.data));   // throws if the passphrase is wrong
      if (document.getElementById('k').checked) { try { localStorage.setItem(KEY, b64(await crypto.subtle.exportKey('raw', key))); } catch {} }
      await open(key);
    } catch {
      btn.disabled = false; btn.textContent = 'Unlock'; msg.textContent = 'That passphrase doesn’t open it. Check it and try again.';
    }
  });
})();
</script>
</body>
